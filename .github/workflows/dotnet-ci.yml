name: .NET CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore projects
        run: |
          dotnet restore RPGManagerLib/RPGManagerLib.csproj
          dotnet restore RPGManager/RPGManager.csproj
          dotnet restore Tools/RoadmapUpdater/RoadmapUpdater.csproj
          dotnet restore RPGManagerLib.Tests/RPGManagerLib.Tests.csproj

      - name: Build library, app and tool
        run: |
          dotnet build RPGManagerLib/RPGManagerLib.csproj --configuration Release --no-restore
          dotnet build RPGManager/RPGManager.csproj --configuration Release --no-restore
          dotnet build Tools/RoadmapUpdater/RoadmapUpdater.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test RPGManagerLib.Tests/RPGManagerLib.Tests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload code coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
