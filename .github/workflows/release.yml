name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and upload release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish for all platforms
        run: |
          set -e
          declare -a RIDS=(win-x64 win-arm64 osx-x64 osx-arm64 linux-x64 linux-arm64)
          for rid in "${RIDS[@]}"; do
            echo "Publishing $rid"
            dotnet publish RPGManager -c Release -r "$rid" -p:PublishSingleFile=true --self-contained true -o "out/$rid"
            (cd "out/$rid" && zip -r "../../RPGManager-$rid.zip" .)
          done

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RPGManager-win-x64.zip
            RPGManager-win-arm64.zip
            RPGManager-osx-x64.zip
            RPGManager-osx-arm64.zip
            RPGManager-linux-x64.zip
            RPGManager-linux-arm64.zip
          tag_name: ${{ github.event.release.tag_name }}
          prerelease: ${{ github.event.release.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
